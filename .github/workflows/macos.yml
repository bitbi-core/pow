name: C/C++ CI

on:
  push:
    branches: ["macos"]
  pull_request:

jobs:
  build-macos:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies, set up environment, and build
      run: |
        brew install llvm cmake
        
        LLVM_PATH=$(brew --prefix llvm)
        echo "LLVM_PATH: $LLVM_PATH"
        
        export PATH="$LLVM_PATH/bin:$PATH"
        export CC="$LLVM_PATH/bin/clang"
        export CXX="$LLVM_PATH/bin/clang++"
        export LDFLAGS="-L$LLVM_PATH/lib -L$LLVM_PATH/lib/c++ -Wl,-rpath,$LLVM_PATH/lib/c++"
        export CPPFLAGS="-I$LLVM_PATH/include"
        
        echo "PATH: $PATH"
        echo "CC: $CC"
        echo "CXX: $CXX"
        
        $CC --version
        $CXX --version
        
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Darwin \
          -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DCMAKE_OSX_SYSROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk \
          -DCMAKE_C_FLAGS="-target x86_64-apple-macos10.15" \
          -DCMAKE_CXX_FLAGS="-target x86_64-apple-macos10.15" \
          -DCMAKE_EXE_LINKER_FLAGS="-target x86_64-apple-macos10.15"
        make VERBOSE=1

    - name: Display build log
      if: failure()
      run: cat build/CMakeFiles/CMakeError.log

    - name: Run tests
      run: |
        lipo -info build/randomx-tests

    - name: Compress artifacts
      run: |
        mkdir include lib
        cp -r src/*.h include
        cp build/librandomx.a lib
        tar -czvf macos-${{ matrix.os }}.tar.gz lib include build/randomx-benchmark

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.os }}
        path: ./macos-${{ matrix.os }}.tar.gz